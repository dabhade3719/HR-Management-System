
{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">Edit Job Opening</h4>
                </div>

                <div class="card-body p-4">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Job Title *</label>
                            <input type="text" name="title"
                                   class="form-control"
                                   value="{{ job.title }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department *</label>
                                <input type="text" name="department"
                                       class="form-control"
                                       value="{{ job.department }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Location *</label>
                                <input type="text" name="location"
                                       class="form-control"
                                       value="{{ job.location }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Job Type *</label>
                                <select name="job_type" class="form-select" required>
                                    {% for value, label in job_types %}
                                        <option value="{{ value }}"
                                            {% if job.job_type == value %}selected{% endif %}>
                                            {{ label }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Vacancies *</label>
                                <input type="number" name="vacancies"
                                       class="form-control"
                                       min="1" value="{{ job.vacancies }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Salary Range</label>
                            <input type="text" name="salary_range"
                                   class="form-control"
                                   value="{{ job.salary_range }}"
                                   placeholder="e.g. ₹3 LPA - ₹5 LPA">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Job Description *</label>
                            <textarea name="description" class="form-control"
                                      rows="4" required>{{ job.description }}</textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Requirements *</label>
                            <textarea name="requirements" class="form-control"
                                      rows="4" required>{{ job.requirements }}</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>
                        <a href="{% url 'recruitment_dashboard' %}"
                           class="btn btn-outline-secondary ms-2">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
