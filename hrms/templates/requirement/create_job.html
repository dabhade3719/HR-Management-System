
{% extends 'base.html' %}

{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">Add New Job</h4>
                </div>

                <div class="card-body p-4">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Job Title *</label>
                            <input type="text" name="title"
                                   class="form-control"
                                   placeholder="e.g. Python Developer"
                                   required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department *</label>
                                <input type="text" name="department"
                                       class="form-control"
                                       placeholder="IT"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Location *</label>
                                <input type="text" name="location"
                                       class="form-control"
                                       placeholder="Pune"
                                       required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Job Type *</label>
                                <select name="job_type" class="form-select" required>
                                    {% for value, label in job_types %}
                                        <option value="{{ value }}">
                                            {{ label }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Vacancies *</label>
                                <input type="number" name="vacancies"
                                       class="form-control"
                                       min="1" value="1" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Salary Range</label>
                            <input type="text" name="salary_range"
                                   class="form-control"
                                   placeholder="e.g. 3–5 LPA">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Job Description *</label>
                            <textarea name="description"
                                      class="form-control"
                                      rows="4" required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Requirements *</label>
                            <textarea name="requirements"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Python, Django, SQL..."
                                      required></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Create Job
                            </button>

                            <a href="{% url 'recruitment_dashboard' %}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
