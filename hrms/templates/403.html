{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied | HRMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            padding: 20px;
        }

        .error-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 12px;
        }

        .code {
            font-size: 16px;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 18px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-btn {
            background: #2563eb;
            color: white;
        }

        .home-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .back-btn:hover {
            background: #d1d5db;
        }

        .brand {
            margin-top: 30px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="error-card">

        <div class="icon">
            🔒
        </div>

        <h1>Access Denied</h1>

        <div class="code">
            Error 403
        </div>

        <p>
            You do not have permission to access this page.
            Please contact your HR or system administrator
            if you believe this is a mistake.
        </p>

        <div class="buttons">

            <a href="{% url 'home' %}" class="home-btn">
                🏠 Go to Home
            </a>

            <a href="javascript:history.back()" class="back-btn">
                ← Go Back
            </a>

        </div>

        <div class="brand">
            HR Management System
        </div>

    </div>
    <script src="{% static 'js/main.js' %}" defer></script>

</body>
</html>
