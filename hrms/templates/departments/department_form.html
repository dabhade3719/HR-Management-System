{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <!-- Header -->
            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    {% if department %}
                        Edit Department
                    {% else %}
                        Add Department
                    {% endif %}
                </h2>

                <p class="text-muted">
                    {% if department %}
                        Update department information.
                    {% else %}
                        Create a new company department.
                    {% endif %}
                </p>

            </div>

            <!-- Form Card -->
            <div class="card border-0 shadow-sm">

                <div class="card-header bg-primary text-white py-3">

                    <h5 class="mb-0 fw-bold">
                        Department Information
                    </h5>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Department Name -->
                        <div class="mb-3">

                            <label for="name" class="form-label fw-semibold">
                                Department Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                class="form-control"
                                placeholder="Enter department name"
                                value="{% if department %}{{ department.name }}{% endif %}"
                                required
                            >

                        </div>

                        <!-- Description -->
                        <div class="mb-3">

                            <label for="description"
                                   class="form-label fw-semibold">

                                Description

                            </label>

                            <textarea
                                id="description"
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Enter department description">{% if department %}{{ department.description }}{% endif %}</textarea>

                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                {% if department %}
                                    Update Department
                                {% else %}
                                    Add Department
                                {% endif %}

                            </button>

                            <a
                                href="{% url 'department_list' %}"
                                class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<style>

    .form-control {
        border-radius: 8px;
        padding: 10px 12px;
        border: 1px solid #ced4da;
    }

    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.15);
    }

    textarea.form-control {
        resize: vertical;
    }

</style>

{% endblock %}
